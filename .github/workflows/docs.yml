name: Docs (MkDocs)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "ARCHITECTURE.md"
      - "DESIGN.md"
      - "SPEC.md"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs deps
        run: pip install -U pip "mkdocs>=1.5" "mkdocs-material>=9.0"
      - name: Sync root pages into docs/
        run: |
          cp ARCHITECTURE.md docs/architecture.md
          cp DESIGN.md docs/design.md
          cp SPEC.md docs/spec.md
          python3 scripts/sync_mkdocs_pages.py
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
