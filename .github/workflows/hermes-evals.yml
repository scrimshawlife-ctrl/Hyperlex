name: Hyperlex Skill Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Check skill
        run: python3 scripts/hyperlex.py check
      - name: Verify sources command
        run: python3 scripts/hyperlex.py sources
      - name: Run smoke
        run: python3 scripts/hyperlex.py smoke
      - name: Run tests
        run: python3 -m pytest -q
