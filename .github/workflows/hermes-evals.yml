name: Hyperlex Skill Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      HYPERLEX_OFFLINE: "1"
      HYPERLEX_NO_RATE_LIMIT: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -U pip pytest jsonschema
      - name: Check skill
        run: python3 scripts/hyperlex.py check
      - name: Doctor
        run: python3 scripts/hyperlex.py doctor
      - name: Verify sources command
        run: python3 scripts/hyperlex.py sources
      - name: Run smoke
        run: python3 scripts/hyperlex.py smoke
      - name: Diagram from golden
        run: python3 scripts/hyperlex.py diagram --from-golden --out-dir out/ci-diagrams --no-html
      - name: Case study runner
        run: python3 scripts/run_case_study.py --out-dir out/ci-case-study
      - name: Run tests
        run: python3 -m pytest -q
