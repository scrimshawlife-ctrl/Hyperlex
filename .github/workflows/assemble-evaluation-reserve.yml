name: assemble-evaluation-reserve

on:
  push:
    branches:
      - cursor/select-001-land-main-41af
    paths:
      - .github/workflows/assemble-evaluation-reserve.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/select-001-land-main-41af
          fetch-depth: 1
      - name: assemble the sealed spec
        run: |
          set -euo pipefail
          cat \
            .land-chunks/part-00 \
            .land-chunks/part-01 \
            .land-chunks/part-02 \
            .land-chunks/part-03 \
            .land-chunks/part-04 \
            .land-chunks/part-05 \
            .land-chunks/part-06 \
            .land-chunks/part-07 \
            .land-chunks/part-08 \
            .land-chunks/part-09 \
            .land-chunks/part-10 \
            .land-chunks/part-11 \
            .land-chunks/part-12 \
            > specs/007-hyperlexical-model/evaluation-reserve.md
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          data = Path("specs/007-hyperlexical-model/evaluation-reserve.md").read_bytes()
          blob = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          if len(data) != 227875 or blob != "dd0de93f81b4f02a9458fe7c3e84e72f7582aada":
              raise SystemExit(f"spec mismatch len={len(data)} blob={blob}")
          print("spec blob", blob)
          PY
          git config user.name "Hyperlex Cloud Agent"
          git config user.email "agent@zer0state.local"
          git add specs/007-hyperlexical-model/evaluation-reserve.md
          git rm -r .land-chunks
          git rm .github/workflows/assemble-evaluation-reserve.yml
          git commit -m "feat(007): land the SELECT evaluation-reserve continuation"
          git push origin HEAD:cursor/select-001-land-main-41af
