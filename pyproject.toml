[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperlex"
dynamic = ["version"]
description = "Standalone memetic emergence engine for slang detection, hyperstition, virality, lineage, settled Brier calibration, and slang mutation-operator detection."
authors = [
    {name = "Applied Alchemy Labs", email = "scrimshawlife@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["memetics", "slang", "hyperstition", "virality", "brier", "hermes", "forecasting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
runtime = [
    "requests>=2.0",
    "crawl4ai",
    "chromadb>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "build>=1.0",
    "twine>=5.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]
schema = [
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/scrimshawlife-ctrl/Hyperlex"
Repository = "https://github.com/scrimshawlife-ctrl/Hyperlex"
Documentation = "https://github.com/scrimshawlife-ctrl/Hyperlex#readme"
Issues = "https://github.com/scrimshawlife-ctrl/Hyperlex/issues"

[project.scripts]
hyperlex = "hyperlex.entrypoint:main"
hlx = "hyperlex.entrypoint:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperlex = [
    "schemas/*.json",
    "data/*.json",
    "data/*.md",
]
