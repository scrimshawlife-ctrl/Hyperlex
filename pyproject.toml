[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperlex"
version = "0.1.2"
description = "Standalone memetic emergence engine for slang detection, hyperstition, virality, and symbolic forecasting."
authors = [
    {name = "Hermes / Abraxas systems"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
runtime = [
    "requests>=2.0",
    "crawl4ai",
]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
]
schema = [
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/scrimshawlife/hyperlex"
Repository = "https://github.com/scrimshawlife/hyperlex"

[project.scripts]
hyperlex = "hyperlex.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperlex = ["schemas/*.json", "schemas/**/*.json"]
