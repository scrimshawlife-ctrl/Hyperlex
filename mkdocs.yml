site_name: Hyperlex
site_description: Hermes skill for memetic emergence analysis (Python package repo)
site_url: https://scrimshawlife-ctrl.github.io/Hyperlex/
repo_url: https://github.com/scrimshawlife-ctrl/Hyperlex
repo_name: Hyperlex
edit_uri: edit/main/docs/

theme:
  name: material
  # Tall Imagine poster is splash hero only (not a 24px chrome logo)
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - assets/css/lineage-map.css

extra_javascript:
  - assets/js/lineage-map.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start Here:
      - Overview: start/index.md
      - Quickstart (offline): start/quickstart.md
      - See it work: start/see-it-work.md
      - Glossary: start/glossary.md
      - Settled Brier only: start/settled-brier.md
  - Operator Guide:
      - Command map: commands.md
      - Operator loop: operator-loop.md
      - Cron / live emergence: cron-live-emergence.md
      - Case studies: case-studies.md
      - Hermes skill: hermes-skill.md
      - Claude Code skill: claude-skill.md
  - Core Reference:
      - Architecture: architecture.md
      - Spec: spec.md
      - API v1: api-v1.md
      - Modules:
          - Ingest: modules/ingest.md
          - Memetics: modules/memetics.md
          - Virality: modules/virality.md
          - Vector DB: modules/vectordb.md
          - LLM: modules/llm.md
      - Slang lineages: slang-lineages.md
      - Slang lineage map: map/index.md
  - Research & Phase 5:
      - Phase 5 overview: phase5.md
      - Simulation modules: modules/simulation.md
      - Reading evidence: demos/reading-evidence.md
      - Atomic multi-term demos: demos/atomic-terms.md
      - Brier design: brier-calibration.md
  - Archive & Telemetry:
      - Telemetry desk: telemetry.md
      - Status: status.md
      - Run history: archive/index.md
      - Latest analysis: archive/latest/index.md
  - Design & Roadmap:
      - Design principles: design.md
      - Design (Orchestra): design-orchestra.md
      - Roadmap: ROADMAP.md
      - Security: SECURITY.md
      - Semver: SEMVER.md
      - Release notes: RELEASE_NOTES.md
      - Diagrams: diagrams.md
      - Rune relay: rune-signal-relay.md
      - Connectors: connectors.md

plugins:
  - search

# Avoid collision: docs/README.md vs docs/index.md
exclude_docs: |
  README.md

extra:
  version: 0.4.0
