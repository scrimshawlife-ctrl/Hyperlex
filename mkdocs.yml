site_name: Hyperlex
site_description: Hermes skill for memetic emergence analysis (Python package repo)
site_url: https://scrimshawlife-ctrl.github.io/Hyperlex/
repo_url: https://github.com/scrimshawlife-ctrl/Hyperlex
repo_name: Hyperlex
edit_uri: edit/main/docs/

theme:
  name: material
  # Tall Imagine poster is splash hero only (not a 24px chrome logo)
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - assets/css/lineage-map.css

extra_javascript:
  - assets/js/lineage-map.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Splash: index.md
  - Telemetry: telemetry.md
  - Status: status.md
  - Run history:
      - Catalog: archive/index.md
      - Latest analysis: archive/latest/index.md
  - Hermes skill: hermes-skill.md
  - API v1: api-v1.md
  - Architecture: architecture.md
  - Design principles: design.md
  - Design (Orchestra notes): design-orchestra.md
  - Spec: spec.md
  - Roadmap: ROADMAP.md
  - Calibration:
      - Brier design: brier-calibration.md
      - Connectors: connectors.md
  - Analysis:
      - Slang lineage map: map/index.md
      - Slang lineages: slang-lineages.md
      - Memetics typology: modules/memetics.md
      - Virality: modules/virality.md
      - Ingest: modules/ingest.md
      - LLM (governed): modules/llm.md
  - Phase 5:
      - Overview: phase5.md
      - Simulation modules: modules/simulation.md
  - Demos:
      - Atomic multi-term seeds: demos/atomic-terms.md
      - Reading evidence (researchers): demos/reading-evidence.md
  - Data:
      - Vector DB: modules/vectordb.md
  - Ops:
      - Operator loop: operator-loop.md
      - Command map: commands.md
      - Cron scan: cron-live-emergence.md
      - Diagrams: diagrams.md
      - Rune relay: rune-signal-relay.md
      - Security: SECURITY.md
      - Semver: SEMVER.md
      - Release notes: RELEASE_NOTES.md
  - Case studies: case-studies.md

plugins:
  - search

# Avoid collision: docs/README.md vs docs/index.md
exclude_docs: |
  README.md

extra:
  version: 0.4.0
