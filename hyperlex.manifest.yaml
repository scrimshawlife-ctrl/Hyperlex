name: hyperlex
version: 0.4.0
display_name: Hyperlex
kind: hermes-openclaw-skill
description: >
  Standalone memetic emergence engine for slang detection, hyperstition
  tracking, virality analysis, lineage matching, settled Brier calibration,
  and slang mutation-operator detection on attested text.
license: MIT
homepage: https://github.com/scrimshawlife-ctrl/Hyperlex
repository: https://github.com/scrimshawlife-ctrl/Hyperlex

skill_entry: SKILL.md
cli_entry: scripts/hyperlex.py
mutation_cli: scripts/hlx-mutation
installer: install.sh
package_root: src/hyperlex

hosts:
  - hermes
  - openclaw

install:
  hermes_path: ~/.hermes/skills/hyperlex
  openclaw_path: ~/.openclaw/skills/hyperlex
  atomic: true
  supports_dry_run: true
  supports_rollback: true
  path_jail_home: true

supports:
  - python3
  - linux
  - darwin

tags:
  - memetics
  - slang
  - hyperstition
  - virality
  - lineage
  - calibration
  - brier
  - mutation
  - algospeak
  - symbolic-analysis
  - hermes-skill

entrypoint: scripts/hyperlex.py

commands:
  - check
  - doctor
  - sources
  - ingest
  - analyze
  - pipeline
  - run
  - pending
  - settle
  - score-series
  - mutation
  - mutation-trace
  - mutation-predict
  - commands
  - scan
  - simulate
  - smoke

intents:
  - pipeline
  - analyze
  - settle
  - mutation-trace
  - mutation-predict
  - slang-mutation
  - algospeak

schemas:
  - schemas/ingest.v1.schema.json
  - schemas/result.v1.schema.json
  - schemas/receipt.v1.schema.json
  - schemas/forecast.v1.schema.json
  - schemas/settlement.v1.schema.json
  - schemas/brier_series.v1.schema.json
  - schemas/lineage.v1.schema.json
  - schemas/mutation_trace.v0.1.schema.json

runtime_profiles:
  stdlib:
    dependencies: []
    guarantee: "mock ingest, analysis, lineage, calibration, receipts, mutation trace with Python 3.10+"
  validation:
    dependencies: ["jsonschema>=4"]
    guarantee: "JSON Schema validation of artifacts"
  network:
    dependencies: ["requests>=2"]
    guarantee: "real/reddit/urban/wikipedia ingest adapters"
  crawl:
    dependencies: ["crawl4ai"]
    guarantee: "firecrawl/crawl4ai web crawl adapters"

metadata:
  hermes:
    skill_type: runtime
    runtime: python
    stdlib_first: true
    category: analysis
  optional_dependencies:
    requests: false
    jsonschema: false
    crawl4ai: false
    chromadb: false

score_log:
  default_path: ~/.hyperlex/score_log.jsonl
  env: HYPERLEX_SCORE_LOG
  events: [forecast, settlement, score]
  hash_chained: true

authority:
  - analyze emits forecasts only; provenance.brier is null until settlement
  - mutation_trace is never forecast-eligible; watch_score is not Brier
  - settle requires operator (or declared) authority
  - VOID/CONFLICT settlements are not scored
  - score_series empty → NOT_COMPUTABLE
  - detector-over-generator; no wrap composition
